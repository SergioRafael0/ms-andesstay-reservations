server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: ms-andesstay-reservations
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER:andesstay}
    password: ${ORACLE_PASSWORD:}
  rabbitmq:
    # Clúster de 2 nodos: se indican ambos endpoints para conmutación de fallos
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:andesstay}
    password: ${RABBITMQ_PASSWORD:andesstay-dev-pass}
    connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.andesstay: INFO
    org.hibernate.SQL: WARN
